name: P2 D19 one-shot chunk-count repair

on:
  push:
    branches:
      - research/p2-shadow-foundation-v0.1
    paths:
      - '.github/workflows/p2-d19-fix-chunk-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'RichardCao06/Process-Certified-Termination'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout P2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/p2-shadow-foundation-v0.1
          fetch-depth: 0

      - name: Update the verified chunk count and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p2-d19-bootstrap.yml')
          text = path.read_text(encoding='utf-8')
          old = "test \"$(find .github/p2-d19-bootstrap -maxdepth 1 -name 'payload-*.b64' -type f | wc -l | tr -d ' ')\" = \"7\""
          new = "test \"$(find .github/p2-d19-bootstrap -maxdepth 1 -name 'payload-*.b64' -type f | wc -l | tr -d ' ')\" = \"8\""
          if text.count(old) != 1:
              raise SystemExit('expected exactly one D19 chunk-count assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/p2-d19-fix-chunk-count.yml
          git config user.name "PCT D19 Repair Bot"
          git config user.email "pct-d19-repair@users.noreply.github.com"
          git add -A
          git commit -m "p2: repair D19 chunk transport count"
          git push origin HEAD:research/p2-shadow-foundation-v0.1
