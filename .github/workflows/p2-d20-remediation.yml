name: P2 D20 remediation validation and guarded rerun

on:
  push:
    branches: [research/p2-shadow-foundation-v0.1]
    paths:
      - '.github/workflows/p2-d20-bootstrap.yml'
      - 'docs/p2/incident-record-PCT-P2-I03.md'
      - 'docs/p2/p2-d20-engineering-smoke-remediation-protocol-v0.1.md'
      - 'governance/p2-human-approval-d20-v0.1.json'
      - 'governance/p2-decision-register-v0.5.json'
      - 'governance/p2-engineering-smoke-remediation-authorization-v0.1.json'
      - 'governance/p2-incident-PCT-P2-I03-v0.1.json'
      - 'governance/p2-status-v0.5.json'
      - 'schemas/pct-p2-engineering-smoke-remediation-v0.3.schema.json'
      - 'scripts/run_p2_engineering_smoke_remediation.py'
      - 'scripts/validate_p2_d20.py'
      - 'tests/test_p2_d20.py'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: pct-p2-d20-remediation
  cancel-in-progress: false

env:
  PCT_P2_BRANCH: research/p2-shadow-foundation-v0.1

jobs:
  validate-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      validated_sha: ${{ steps.freeze.outputs.validated_sha }}
    steps:
      - name: Checkout exact D20 implementation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require the frozen P2 branch and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${PCT_P2_BRANCH}"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 0deadc1463706175e7e462e67097c4bb6f7ba6b5 HEAD

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate D20 before any secret or model access
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_p2_d20.py
          python3 -m unittest tests.test_p2_d20 -v
          python3 -m py_compile \
            scripts/run_p2_engineering_smoke_remediation.py \
            scripts/validate_p2_d20.py
          make validate

      - name: Freeze validated commit identity
        id: freeze
        shell: bash
        run: echo "validated_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  guarded-remediation-rerun:
    needs: validate-remediation
    if: needs.validate-remediation.result == 'success'
    environment: p2-natural-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Checkout validated D20 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-remediation.outputs.validated_sha }}
          fetch-depth: 0

      - name: Require protected DeepSeek credential without displaying it
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +x
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "Protected credential is present; value is not displayed."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate repository before model access
        run: make validate

      - name: Checkout exact frozen DeepSeek Harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: _vendor/deepseek-harness
          fetch-depth: 1

      - name: Validate exact frozen DSH source
        env:
          PCT_DSH_SOURCE_DIR: ${{ github.workspace }}/_vendor/deepseek-harness
          PCT_REQUIRE_DSH_CONFORMANCE: '1'
        run: python3 scripts/validate_p2_dsh_conformance.py

      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install exact frozen DSH dependencies
        working-directory: _vendor/deepseek-harness
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify TypeScript source-mode resolution without model access
        working-directory: _vendor/deepseek-harness
        env:
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/_vendor/deepseek-harness/tsconfig.json
        shell: bash
        run: |
          set -euo pipefail
          loader="$PWD/node_modules/tsx/dist/esm/index.mjs"
          test -f "$loader"
          test -f "$TSX_TSCONFIG_PATH"
          node --import "$loader" --input-type=module -e \
            "await import('@deepseek-ai/dsh-app-boot'); await import('@deepseek-ai/cordis'); console.log('DSH source-mode resolution PASS')"

      - name: Rerun only the same two engineering fixtures
        id: smoke
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python3 scripts/run_p2_engineering_smoke_remediation.py \
            --dsh-source _vendor/deepseek-harness
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e

      - name: Remove vendored runtime before scans
        if: always()
        run: rm -rf _vendor

      - name: Validate append-only remediation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_p2_d20.py
          make validate

      - name: Upload sanitized evidence fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pct-p2-d20-remediation-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            reports/p2/deepseek-provider-introspection-v0.3.json
            reports/p2/engineering-smoke-remediation-run-v0.3.json
            reports/p2/engineering-smoke-remediation-summary-v0.3.md
            governance/p2-pre-smoke-binding-verification-v0.2.json
            governance/p2-engineering-smoke-remediation-result-v0.1.json
            governance/p2-status-v0.6.json
            docs/p2/p2-human-decision-pack-d21-v0.1.md

      - name: Persist sanitized evidence from the latest remote branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pct-d20-evidence"
          paths=(
            reports/p2/deepseek-provider-introspection-v0.3.json
            reports/p2/engineering-smoke-remediation-run-v0.3.json
            reports/p2/engineering-smoke-remediation-summary-v0.3.md
            governance/p2-pre-smoke-binding-verification-v0.2.json
            governance/p2-engineering-smoke-remediation-result-v0.1.json
            governance/p2-status-v0.6.json
            docs/p2/p2-human-decision-pack-d21-v0.1.md
          )
          mkdir -p "$evidence"
          for path in "${paths[@]}"; do
            test -f "$path"
            mkdir -p "$evidence/$(dirname "$path")"
            cp "$path" "$evidence/$path"
          done
          git config user.name "PCT D20 Evidence Bot"
          git config user.email "pct-d20-evidence@users.noreply.github.com"
          persisted=0
          for attempt in 1 2 3; do
            git fetch origin "$PCT_P2_BRANCH"
            git checkout -B "$PCT_P2_BRANCH" "origin/$PCT_P2_BRANCH"
            for path in "${paths[@]}"; do
              mkdir -p "$(dirname "$path")"
              cp "$evidence/$path" "$path"
            done
            python3 scripts/validate_p2_d20.py
            make validate
            git add -- "${paths[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "p2: preserve D20 engineering remediation evidence"
            fi
            if git push origin "HEAD:$PCT_P2_BRANCH"; then
              persisted=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$persisted" = 1

      - name: Return remediation result after evidence persistence
        if: always()
        shell: bash
        run: exit "${{ steps.smoke.outputs.exit_code || '1' }}"
