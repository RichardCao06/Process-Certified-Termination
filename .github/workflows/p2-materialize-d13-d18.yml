name: P2 D13-D18 protocol materialization

on:
  push:
    branches:
      - research/p2-shadow-foundation-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PCT repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check whether the protocol is already materialized
        id: gate
        run: |
          if test -f reports/p2/d13-d18-protocol-materialization-manifest-v0.1.json; then
            echo "materialize=false" >> "$GITHUB_OUTPUT"
            echo "D13-D18 protocol already present."
          else
            echo "materialize=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize approved D13-D18 protocol
        if: steps.gate.outputs.materialize == 'true'
        run: python3 scripts/materialize_p2_d13_d18_bundle.py

      - name: Validate natural-pilot preflight and full repository
        if: steps.gate.outputs.materialize == 'true'
        run: |
          python3 scripts/validate_p2_natural_pilot_preflight.py
          make validate

      - name: Commit materialized protocol increment
        if: steps.gate.outputs.materialize == 'true'
        run: |
          git config user.name "PCT Research Agent"
          git config user.email "pct-research-agent@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "p2: materialize D13-D18 natural pilot preflight"
          git push origin HEAD:research/p2-shadow-foundation-v0.1
