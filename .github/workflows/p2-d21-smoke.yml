name: P2 D21 official-patch bounded engineering run

on:
  pull_request:
  push:
    branches: [codex/p2-d21-bounded-rerun]
    paths: ['governance/p2-human-approval-d21-v0.1.json']
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: pct-p2-d21-${{ github.event_name == 'pull_request' && github.ref || 'single-authorization' }}
  cancel-in-progress: false

jobs:
  validate-no-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate approval and all repository checks without credentials
        run: |
          python3 scripts/validate_p2_d21_execution.py
          make validate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: _vendor/deepseek-harness
          persist-credentials: false
      - name: Check frozen upstream conformance
        env:
          PCT_DSH_SOURCE_DIR: ${{ github.workspace }}/_vendor/deepseek-harness
          PCT_REQUIRE_DSH_CONFORMANCE: '1'
        run: python3 scripts/validate_p2_dsh_conformance.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install frozen DSH dependencies
        working-directory: _vendor/deepseek-harness
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Test the actual D21 driver without a model turn
        run: >-
          python3 scripts/run_p2_d21_smoke.py
          --dsh-source _vendor/deepseek-harness
          --output-dir "${{ runner.temp }}/pct-d21-no-model"
          --no-model
      - name: Preserve no-model driver evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pct-p2-d21-no-model-${{ github.run_id }}
          path: ${{ runner.temp }}/pct-d21-no-model/*.json
          if-no-files-found: warn
          retention-days: 30

  engineering-smoke:
    if: github.event_name != 'pull_request'
    needs: validate-no-model
    environment: p2-natural-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      deployments: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reserve D21 authorization once, after human Environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/environments/p2-natural-pilot" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[] | select(.reviewer.login == "RichardCao06")] | length' \
            > "$RUNNER_TEMP/pct-d21-reviewer-count"
          test "$(cat "$RUNNER_TEMP/pct-d21-reviewer-count")" -ge 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/pct-p2-d21-authorization-consumed -f sha="$GITHUB_SHA" \
            --jq '{ref,sha:.object.sha}' > "$RUNNER_TEMP/pct-d21-reservation.json"
          echo "PCT_D21_RESERVATION_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo 'PCT_D21_ENVIRONMENT_REVIEWED=true' >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate exact approved commit before secret access
        run: |
          python3 scripts/validate_p2_d21_execution.py
          make validate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: _vendor/deepseek-harness
          persist-credentials: false
      - name: Check exact upstream conformance
        env:
          PCT_DSH_SOURCE_DIR: ${{ github.workspace }}/_vendor/deepseek-harness
          PCT_REQUIRE_DSH_CONFORMANCE: '1'
        run: python3 scripts/validate_p2_dsh_conformance.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install frozen DSH dependencies
        working-directory: _vendor/deepseek-harness
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Repeat credential-free driver check on the protected runner
        run: >-
          python3 scripts/run_p2_d21_smoke.py
          --dsh-source _vendor/deepseek-harness
          --output-dir "${{ runner.temp }}/pct-d21-protected-boot"
          --no-model
      - name: Run each original engineering fixture once
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          python3 scripts/run_p2_d21_smoke.py
          --dsh-source _vendor/deepseek-harness
          --output-dir "${{ runner.temp }}/pct-d21-evidence"
      - name: Preserve sanitized evidence regardless of result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pct-p2-d21-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pct-d21-evidence/*.json
            ${{ runner.temp }}/pct-d21-protected-boot/*.json
            ${{ runner.temp }}/pct-d21-reservation.json
          if-no-files-found: warn
          retention-days: 30
