name: P2 D20 remediation materialization and guarded rerun

on:
  push:
    branches: [research/p2-shadow-foundation-v0.1]
    paths: ['.github/workflows/p2-d20-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: pct-p2-d20-remediation
  cancel-in-progress: false

env:
  PCT_P2_BRANCH: research/p2-shadow-foundation-v0.1
  PCT_D20_BASE_ANCESTOR: 0deadc1463706175e7e462e67097c4bb6f7ba6b5
  PCT_D20_PAYLOAD_SHA256: e719f7b8f5bac679880fb211084c7b47834e34280d043f2df37de31ad33ff31a

jobs:
  materialize-and-validate:
    if: github.repository == 'RichardCao06/Process-Certified-Termination'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      materialized_sha: ${{ steps.commit.outputs.materialized_sha }}
    steps:
      - name: Checkout P2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PCT_P2_BRANCH }}
          fetch-depth: 0

      - name: Verify branch and D20 approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$PCT_P2_BRANCH"
          git merge-base --is-ancestor "$PCT_D20_BASE_ANCESTOR" HEAD
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/RichardCao06/Process-Certified-Termination/issues/comments/5434319705',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              value = json.load(response)
          assert value['user']['login'] == 'RichardCao06'
          assert value['body'].strip() == 'PCT-P2-D20: A'
          print('Verified PCT-P2-D20: A, comment 5434319705.')
          PY

