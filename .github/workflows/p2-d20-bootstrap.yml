          python3 scripts/validate_p2_d20.py
          python3 -m unittest tests.test_p2_d20 -v
          python3 -m py_compile scripts/run_p2_engineering_smoke_remediation.py scripts/validate_p2_d20.py
          make validate

      - name: Commit D20 implementation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PCT D20 Remediation Bot"
          git config user.email "pct-d20-remediation@users.noreply.github.com"
          git add -- Makefile docs/p2/incident-record-PCT-P2-I03.md docs/p2/p2-d20-engineering-smoke-remediation-protocol-v0.1.md governance/p2-decision-register-v0.5.json governance/p2-engineering-smoke-remediation-authorization-v0.1.json governance/p2-human-approval-d20-v0.1.json governance/p2-incident-PCT-P2-I03-v0.1.json governance/p2-status-v0.5.json schemas/pct-p2-engineering-smoke-remediation-v0.3.schema.json scripts/run_p2_engineering_smoke_remediation.py scripts/validate_p2_d20.py tests/test_p2_d20.py
          if git diff --cached --quiet; then
            sha="$(git rev-parse HEAD)"
          else
            git commit -m "p2: materialize approved D20 engineering remediation"
            git push origin "HEAD:$PCT_P2_BRANCH"
            sha="$(git rev-parse HEAD)"
          fi
          echo "materialized_sha=$sha" >> "$GITHUB_OUTPUT"

  guarded-remediation-rerun:
    needs: materialize-and-validate
    if: needs.materialize-and-validate.result == 'success'
    environment: p2-natural-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Checkout D20 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.materialize-and-validate.outputs.materialized_sha }}
          fetch-depth: 0

      - name: Require protected DeepSeek credential
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +x
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "Protected credential is present; value is not displayed."

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate repository before model access
        run: make validate

      - name: Checkout exact frozen DSH
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: _vendor/deepseek-harness
          fetch-depth: 1

      - name: Validate DSH source
        env:
          PCT_DSH_SOURCE_DIR: ${{ github.workspace }}/_vendor/deepseek-harness
          PCT_REQUIRE_DSH_CONFORMANCE: '1'
        run: python3 scripts/validate_p2_dsh_conformance.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install exact DSH dependencies
        working-directory: _vendor/deepseek-harness
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify TypeScript source-mode resolution without model access
        working-directory: _vendor/deepseek-harness
        env:
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/_vendor/deepseek-harness/tsconfig.json
        run: |
          set -euo pipefail
          loader="$PWD/node_modules/tsx/dist/esm/index.mjs"
          test -f "$loader"
          test -f "$TSX_TSCONFIG_PATH"
          node --import "$loader" --input-type=module -e "await import('@deepseek-ai/dsh-app-boot'); await import('@deepseek-ai/cordis'); console.log('DSH source-mode resolution PASS')"

      - name: Rerun only the same two engineering fixtures
        id: smoke
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python3 scripts/run_p2_engineering_smoke_remediation.py --dsh-source _vendor/deepseek-harness
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e

      - name: Remove vendored runtime
        if: always()
        run: rm -rf _vendor

      - name: Validate append-only evidence
        if: always()
        run: |
          python3 scripts/validate_p2_d20.py
          make validate

      - name: Upload sanitized evidence fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pct-p2-d20-remediation-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            reports/p2/deepseek-provider-introspection-v0.3.json
            reports/p2/engineering-smoke-remediation-run-v0.3.json
            reports/p2/engineering-smoke-remediation-summary-v0.3.md
            governance/p2-pre-smoke-binding-verification-v0.2.json
            governance/p2-engineering-smoke-remediation-result-v0.1.json
            governance/p2-status-v0.6.json
            docs/p2/p2-human-decision-pack-d21-v0.1.md

      - name: Persist evidence from latest remote branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pct-d20-evidence"
          paths=(reports/p2/deepseek-provider-introspection-v0.3.json reports/p2/engineering-smoke-remediation-run-v0.3.json reports/p2/engineering-smoke-remediation-summary-v0.3.md governance/p2-pre-smoke-binding-verification-v0.2.json governance/p2-engineering-smoke-remediation-result-v0.1.json governance/p2-status-v0.6.json docs/p2/p2-human-decision-pack-d21-v0.1.md)
          mkdir -p "$evidence"
          for path in "${paths[@]}"; do test -f "$path"; mkdir -p "$evidence/$(dirname "$path")"; cp "$path" "$evidence/$path"; done
          git config user.name "PCT D20 Evidence Bot"
          git config user.email "pct-d20-evidence@users.noreply.github.com"
          persisted=0
          for attempt in 1 2 3; do
            git fetch origin "$PCT_P2_BRANCH"
            git checkout -B "$PCT_P2_BRANCH" "origin/$PCT_P2_BRANCH"
            for path in "${paths[@]}"; do mkdir -p "$(dirname "$path")"; cp "$evidence/$path" "$path"; done
            python3 scripts/validate_p2_d20.py
            make validate
            git add -- "${paths[@]}"
            if ! git diff --cached --quiet; then git commit -m "p2: preserve D20 engineering remediation evidence"; fi
            if git push origin "HEAD:$PCT_P2_BRANCH"; then persisted=1; break; fi
            sleep $((attempt * 2))
          done
          test "$persisted" = 1

      - name: Return remediation result after persistence
        if: always()
        run: exit "${{ steps.smoke.outputs.exit_code || '1' }}"
