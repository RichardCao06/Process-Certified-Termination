name: P2 D21 no-model evidence materialization

on:
  push:
    branches: [research/p2-shadow-foundation-v0.1]
    paths:
      - '.github/p2-d21-bootstrap/payload.b64'
      - '.github/workflows/p2-d21-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pct-p2-d21-materialization
  cancel-in-progress: false

env:
  PCT_P2_BRANCH: research/p2-shadow-foundation-v0.1
  PCT_D21_BASE_ANCESTOR: 777245f420cfde0c2ae58fb47ed254fdca554c23
  PCT_D21_PAYLOAD_SHA256: a138fdc8f603771471225774eded420484bafb3542d289f9f2427ceb3c3d1a26

jobs:
  materialize-no-model-evidence:
    if: github.repository == 'RichardCao06/Process-Certified-Termination'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current P2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PCT_P2_BRANCH }}
          fetch-depth: 0

      - name: Require frozen branch ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$PCT_P2_BRANCH"
          git merge-base --is-ancestor "$PCT_D21_BASE_ANCESTOR" HEAD
          test -z "$(git status --porcelain)"

      - name: Detect already materialized no-op run
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/p2-d21-bootstrap/payload.b64; then
            echo 'materialize=true' >> "$GITHUB_OUTPUT"
          else
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
            echo 'D21 payload already consumed; no-op.'
          fi

      - name: Set up Python
        if: steps.gate.outputs.materialize == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify and extract frozen D21 payload
        if: steps.gate.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/pct-d21-overlay.tar.gz"
          tr -d '\n\r ' < .github/p2-d21-bootstrap/payload.b64 | base64 --decode > "$payload"
          echo "$PCT_D21_PAYLOAD_SHA256  $payload" | sha256sum --check --strict
          tar -tzf "$payload" >/dev/null
          tar -xzf "$payload" -C "$GITHUB_WORKSPACE"
          rm -rf .github/p2-d21-bootstrap
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate D21 evidence before commit
        if: steps.gate.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_p2_d21_preflight.py
          python3 -m unittest tests.test_p2_d21_preflight -v
          python3 -m py_compile scripts/validate_p2_d21_preflight.py tests/test_p2_d21_preflight.py
          make validate

      - name: Commit append-only D21 preflight package
        if: steps.gate.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PCT D21 Materialization Bot'
          git config user.email 'pct-d21-materialization@users.noreply.github.com'
          git add -A -- \
            .github/p2-d21-bootstrap \
            docs/p2/archives/p2-engineering-smoke-d19-workflow-v0.1.yml \
            docs/p2/incident-record-PCT-P2-I04.md \
            docs/p2/p2-d21-official-patch-rerun-preflight-v0.1.md \
            docs/p2/p2-human-decision-pack-d21-v0.2.md \
            governance/p2-decision-register-v0.6.json \
            governance/p2-incident-PCT-P2-I04-v0.1.json \
            governance/p2-no-model-config-diagnostic-freeze-v0.1.json \
            governance/p2-official-patch-validation-freeze-v0.1.json \
            governance/p2-status-v0.7.json \
            reports/p2/cordis-config-boot-diagnostic-v0.1.json \
            reports/p2/official-patch-no-model-validation-v0.1.json \
            scripts/validate_p2_d21_preflight.py \
            tests/test_p2_d21_preflight.py
          git commit -m 'p2: freeze no-model root cause and open D21 gate'
          git push origin "HEAD:$PCT_P2_BRANCH"
