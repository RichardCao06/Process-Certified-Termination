name: P2 D19 guarded engineering smoke

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.github/workflows/p2-engineering-smoke.yml'
      - 'governance/p2-human-approval-d19-v0.1.json'
      - 'governance/p2-operational-caps-v0.1.json'
      - 'governance/p2-worker-profile-freeze-v0.2.json'
      - 'governance/p2-engineering-smoke-authorization-v0.1.json'
      - 'config/p2/deepseek-v4-pro-operational-profile-v0.2.json'
      - 'config/p2/d19-runtime-tool-catalog-v0.1.json'
      - 'config/p2/dsh-engineering-smoke.cordis.yml'
      - 'data/p2/engineering-smoke/**'
      - 'scripts/run_p2_engineering_smoke.py'
      - 'scripts/validate_p2_d19.py'
      - 'scripts/validate_p2_engineering_smoke.py'
      - 'tests/test_p2_d19.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PCT_D19_BRANCH: research/p2-shadow-foundation-v0.1

jobs:
  engineering-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    environment: p2-natural-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the frozen same-repository P2 branch
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${branch}" = "${PCT_D19_BRANCH}"
      - name: Checkout the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate the complete PCT repository before model access
        run: make validate
      - name: Checkout the exact frozen DeepSeek Harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: _vendor/deepseek-harness
          fetch-depth: 1
      - name: Validate exact frozen DSH source
        env:
          PCT_DSH_SOURCE_DIR: ${{ github.workspace }}/_vendor/deepseek-harness
          PCT_REQUIRE_DSH_CONFORMANCE: '1'
        run: python3 scripts/validate_p2_dsh_conformance.py
      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install the exact frozen DSH dependencies
        working-directory: _vendor/deepseek-harness
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Require the approved Environment credential without displaying it
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +x
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "Approved DeepSeek credential is available; value is not displayed."
      - name: Run at most two engineering-only trajectories and always preserve a sanitized report
        id: smoke
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python3 scripts/run_p2_engineering_smoke.py --dsh-source _vendor/deepseek-harness
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          set -e
      - name: Remove vendored runtime before repository scans and persistence
        run: rm -rf _vendor
      - name: Validate the preserved D19 result
        run: python3 scripts/validate_p2_engineering_smoke.py
      - name: Re-run the complete repository validation against the generated evidence
        run: make validate
      - name: Upload sanitized evidence as a persistence fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pct-p2-d19-sanitized-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/p2/deepseek-provider-introspection-v0.2.json
            reports/p2/engineering-smoke-run-v0.2.json
            reports/p2/engineering-smoke-summary-v0.2.md
            governance/p2-pre-smoke-binding-verification-v0.1.json
            docs/p2/p2-human-decision-pack-d20-v0.1.md
      - name: Persist only sanitized append-only evidence
        shell: bash
        run: |
          git config user.name "PCT D19 Evidence Bot"
          git config user.email "pct-d19-evidence@users.noreply.github.com"
          git add -- \
            reports/p2/deepseek-provider-introspection-v0.2.json \
            reports/p2/engineering-smoke-run-v0.2.json \
            reports/p2/engineering-smoke-summary-v0.2.md \
            governance/p2-pre-smoke-binding-verification-v0.1.json \
            docs/p2/p2-human-decision-pack-d20-v0.1.md
          if ! git diff --cached --quiet; then
            git commit -m "p2: preserve D19 engineering smoke evidence"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Return the smoke status after evidence persistence
        shell: bash
        run: exit "${{ steps.smoke.outputs.exit_code }}"
