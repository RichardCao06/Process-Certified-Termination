name: P2 D20 guarded engineering smoke remediation

on:
  push:
    branches:
      - research/p2-shadow-foundation-v0.1
    paths:
      - '.github/workflows/p2-engineering-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pct-p2-d20-remediation
  cancel-in-progress: false

env:
  PCT_D20_BRANCH: research/p2-shadow-foundation-v0.1
  PCT_D20_BASE_SHA: 0deadc1463706175e7e462e67097c4bb6f7ba6b5
  PCT_D20_PAYLOAD_SHA256: 69e0111023da3ecbfc804126448ac7cf277cb9bc3da0de4296068175969ad3cd

jobs:
  materialize-and-validate:
    if: github.repository == 'RichardCao06/Process-Certified-Termination'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      materialized_sha: ${{ steps.commit.outputs.materialized_sha }}
    steps:
      - name: Checkout the P2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PCT_D20_BRANCH }}
          fetch-depth: 0

      - name: Verify branch ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$PCT_D20_BRANCH"
          git merge-base --is-ancestor "$PCT_D20_BASE_SHA" HEAD
          test -z "$(git status --porcelain)"

      - name: Materialize and verify the approved D20 payload
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/pct-d20-overlay.tar.gz"
          test -f .github/p2-d20-bootstrap/payload.b64
          tr -d '\n\r ' < .github/p2-d20-bootstrap/payload.b64 | base64 --decode > "$payload"
          echo "$PCT_D20_PAYLOAD_SHA256  $payload" | sha256sum --check --strict
          tar -tzf "$payload" >/dev/null
          tar -xzf "$payload" -C "$GITHUB_WORKSPACE"
          rm -rf .github/p2-d20-bootstrap
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate D20 before any secret or model access
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_p2_d20.py
          python3 -m unittest tests.test_p2_d20 -v
          python3 -m py_compile \
            scripts/run_p2_engineering_smoke_remediation.py \
            scripts/validate_p2_d20.py \
            scripts/validate_p2_engineering_smoke_remediation.py
          make validate

      - name: Commit the validated non-workflow D20 package
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PCT D20 Materialization Bot"
          git config user.email "pct-d20-materialization@users.noreply.github.com"
          git add -A -- \
            .github/p2-d20-bootstrap \
            Makefile \
            docs/p2/p2-d20-remediation-plan-v0.1.md \
            governance/p2-decision-register-v0.5.json \
            governance/p2-engineering-smoke-remediation-authorization-v0.1.json \
            governance/p2-human-approval-d20-v0.1.json \
            governance/p2-status-v0.5.json \
            schemas/pct-p2-engineering-smoke-remediation-report-v0.3.schema.json \
            scripts/run_p2_engineering_smoke_remediation.py \
            scripts/validate_p2_d20.py \
            scripts/validate_p2_engineering_smoke_remediation.py \
            tests/test_p2_d20.py
          git commit -m "p2: materialize approved D20 remediation"
          git push origin "HEAD:$PCT_D20_BRANCH"
          sha="$(git rev-parse HEAD)"
          echo "materialized_sha=$sha" >> "$GITHUB_OUTPUT"

  guarded-engineering-remediation:
    needs: materialize-and-validate
    if: needs.materialize-and-validate.result == 'success'
    environment: p2-natural-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout the materialized D20 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.materialize-and-validate.outputs.materialized_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate repository before model access
        run: make validate

      - name: Checkout the exact frozen DeepSeek Harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: _vendor/deepseek-harness
          fetch-depth: 1

      - name: Validate exact frozen DSH source
        env:
          PCT_DSH_SOURCE_DIR: ${{ github.workspace }}/_vendor/deepseek-harness
          PCT_REQUIRE_DSH_CONFORMANCE: '1'
        run: python3 scripts/validate_p2_dsh_conformance.py

      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install the exact frozen DSH dependencies
        working-directory: _vendor/deepseek-harness
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Require the approved Environment credential without displaying it
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +x
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "Approved DeepSeek credential is available; value is not displayed."

      - name: Rerun only the same two engineering fixtures
        id: remediation
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python3 scripts/run_p2_engineering_smoke_remediation.py --dsh-source _vendor/deepseek-harness
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e

      - name: Remove vendored runtime before scans
        if: always()
        run: rm -rf _vendor

      - name: Validate append-only sanitized remediation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_p2_engineering_smoke_remediation.py
          make validate

      - name: Upload sanitized D20 remediation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pct-p2-d20-sanitized-remediation-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            reports/p2/deepseek-provider-introspection-v0.3.json
            reports/p2/engineering-smoke-remediation-run-v0.3.json
            reports/p2/engineering-smoke-summary-v0.3.md
            governance/p2-pre-smoke-binding-verification-v0.2.json
            docs/p2/p2-human-decision-pack-d21-v0.1.md

      - name: Return the remediation status after artifact persistence
        if: always()
        shell: bash
        run: exit "${{ steps.remediation.outputs.exit_code || '1' }}"
