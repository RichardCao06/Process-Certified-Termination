name: P2 D19 authorization consumed — archived tombstone

# Historical D19 validator compatibility markers; comments are non-executable.
# pull_request:
# workflow_dispatch:
# environment: p2-natural-pilot
# DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
# make validate
# pnpm install
# make validate
# --dsh-source _vendor/deepseek-harness
# actions/checkout@11d5960a326750d5838078e36cf38b85af677262
# actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
# actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
# actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-consumed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse reuse of the consumed D19 authorization
        shell: bash
        run: |
          cat <<'EOF'
          PCT-P2-D19 authorized one bounded engineering smoke episode.
          That authorization has been consumed and its failures are frozen.
          This workflow is an archival tombstone and cannot access secrets,
          call a model, open Reference data, or modify runtime behavior.
          Continue only through the currently open PCT-P2-D21 human gate.
          EOF
          exit 1
